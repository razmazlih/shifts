services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shifts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: shifts
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shifts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shifts -d shifts"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://shifts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/shifts?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
volumes:
  shifts_data:
